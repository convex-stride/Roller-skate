name: itch.io build artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create itch.io browser ZIP (index.html at root)
        run: (cd dist && zip -q -r ../layans-skate-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: layans-skate-web
          path: layans-skate-web.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate default Tauri Windows icons
        run: npx --yes @tauri-apps/cli@2 icon tools/tauri-icon.svg --output src-tauri/icons
        env:
          CI: true
      - name: Compile Windows installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: layans-skate-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
