name: itch.io build artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'tools/tauri-icon.svg'
      - '.github/workflows/itchio-builds.yml'
      - 'src/**'
      - 'package*.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Normalize npm lockfile for CI
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create itch.io browser ZIP (index.html at root)
        run: (cd dist && zip -q -r ../layans-skate-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: layans-skate-web
          path: layans-skate-web.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Normalize npm lockfile for CI
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Generate Tauri Windows icons
        run: npx --yes @tauri-apps/cli@2 icon tools/tauri-icon.svg --output src-tauri/icons
        env:
          CI: true
      - name: Compile Windows installer
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: layans-skate-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Set up Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Generate Tauri icons
        run: npx --yes @tauri-apps/cli@2 icon tools/tauri-icon.svg --output src-tauri/icons
      - name: Initialize Android host
        run: npx --yes @tauri-apps/cli@2 android init
      - name: Build debug APK (not release signed)
        run: npx --yes @tauri-apps/cli@2 android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: layans-skate-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
