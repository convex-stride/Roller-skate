name: Download builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-builds.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run package:windows 2>&1 | tee /tmp/layans-windows-build.log
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: .local-signing/android-preview.jks
          key: android-preview-signing-v1
      - run: npm run package:android 2>&1 | tee /tmp/layans-android-build.log
      - run: npm run test:downloads 2>&1 | tee /tmp/layans-download-check.log
      - name: Add itch.io upload instructions
        run: |
          cat > releases/ITCH-UPLOAD.txt <<'EOF'
          Layan's Skate — itch.io uploads

          Extract this GitHub artifact ZIP once. Upload these three files to one itch.io HTML project:
          layans-skate-v0.24.zip — check "This file will be played in the browser".
          layans-skate-0.24.0-windows-x64.zip — select Windows.
          layans-skate-0.24.0-android.apk — select Android.

          Keep the inner ZIP files intact. Do not upload the outer GitHub artifact ZIP as the HTML game.
          Native packages are preview builds and require testing on actual devices before public release.
          EOF
      - uses: actions/upload-artifact@v4
        id: downloads
        with:
          name: layans-skate-downloads
          path: |
            releases/layans-skate-*-windows-x64.zip
            releases/layans-skate-*-android.apk
            releases/layans-skate-v*.zip
            releases/SHA256SUMS.txt
            releases/ITCH-UPLOAD.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Show browser download link
        env:
          LAYANS_DOWNLOAD_URL: ${{ steps.downloads.outputs.artifact-url }}
        run: |
          printf '[Download all three itch.io uploads](%s)\n\nSign into GitHub to download. Extract the outer ZIP once and follow ITCH-UPLOAD.txt.\n' "$LAYANS_DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize native build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              for name in ['windows-build','android-build','download-check']:
                  path=Path('/tmp/layans-'+name+'.log')
                  if not path.exists():continue
                  lines=[line for line in path.read_text(errors='replace').splitlines() if re.search(r'error|exception|not found|no such file|failed',line,re.I)]
                  safe=re.sub(r'https?://\S+','[URL]','\n'.join(lines[-15:]))
                  safe=re.sub(r'(?i)(token|password|secret|authorization)(\s*[:=]\s*)\S+',r'\1\2[redacted]',safe)
                  summary.write('\n'+name+':\n```text\n'+safe[:4000]+'\n```\n')
          PY
