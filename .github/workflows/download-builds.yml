name: Download builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-builds.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify runner Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run package:windows 2>&1 | tee /tmp/layans-windows-build.log
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: .local-signing/android-preview.jks
          key: android-preview-signing-v1
      - run: npm run package:android 2>&1 | tee /tmp/layans-android-build.log
      - run: npm run test:downloads 2>&1 | tee /tmp/layans-download-check.log
      - name: Upload web game as-is
        uses: actions/upload-artifact@v7
        id: web
        with:
          path: releases/layans-skate-v0.24.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Upload Windows game as-is
        uses: actions/upload-artifact@v7
        id: windows
        with:
          path: releases/layans-skate-0.24.0-windows-x64.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Upload Android game as-is
        uses: actions/upload-artifact@v7
        id: android
        with:
          path: releases/layans-skate-0.24.0-android.apk
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Show separate download links
        env:
          LAYANS_WEB_URL: ${{ steps.web.outputs.artifact-url }}
          LAYANS_WINDOWS_URL: ${{ steps.windows.outputs.artifact-url }}
          LAYANS_ANDROID_URL: ${{ steps.android.outputs.artifact-url }}
        run: |
          printf '[Web ZIP](%s) · [Windows ZIP](%s) · [Android APK](%s)\n\nSign into GitHub to download. Upload each file directly to itch.io, keeping both ZIPs intact.\n' "$LAYANS_WEB_URL" "$LAYANS_WINDOWS_URL" "$LAYANS_ANDROID_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize native build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              for name in ['windows-build','android-build','download-check']:
                  path=Path('/tmp/layans-'+name+'.log')
                  if not path.exists():continue
                  lines=[line for line in path.read_text(errors='replace').splitlines() if re.search(r'error|exception|not found|no such file|failed',line,re.I)]
                  safe=re.sub(r'https?://\S+','[URL]','\n'.join(lines[-15:]))
                  safe=re.sub(r'(?i)(token|password|secret|authorization)(\s*[:=]\s*)\S+',r'\1\2[redacted]',safe)
                  summary.write('\n'+name+':\n```text\n'+safe[:4000]+'\n```\n')
          PY
